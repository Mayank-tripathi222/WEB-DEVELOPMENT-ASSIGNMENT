
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h3>Menu</h3>
            <p>🏠 Home</p>
            <p>👤 Profile</p>
            <p>⚙️ Settings</p>
            <p>📊 Reports</p>
        </aside>

        <!-- Main Area -->
        <main class="main">

            <h2>Dashboard Overview</h2>
            <p>Welcome to your dashboard!</p>

            <div class="cards">

                <div class="card">
                    <span class="icon">👨‍🎓</span>
                    <div class="card-text">
                        <h3>1200</h3>
                        <p>Total Students</p>
                    </div>
                </div>

                <div class="card">
                    <span class="icon">📚</span>
                    <div class="card-text">
                        <h3>25</h3>
                        <p>Total Courses</p>
                    </div>
                </div>

                <div class="card">
                    <span class="icon">📝</span>
                    <div class="card-text">
                        <h3>80</h3>
                        <p>Assignments</p>
                    </div>
                </div>

                <div class="card">
                    <span class="icon">💻</span>
                    <div class="card-text">
                        <h3>15</h3>
                        <p>Projects</p>
                    </div>
                </div>

            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>© 2026 My Dashboard | All Rights Reserved</p>
        </footer>

    </div>

</body>
</html>
